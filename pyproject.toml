[project]
name = "sorteio"
version = "0.1.0"
description = "Aplicação declarativa em Flet para sorteios numéricos."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flet==1.0.4",
]

[dependency-groups]
dev = [
    "flet-cli==1.0.4",
    "flet-desktop==1.0.4",
    "flet-web==1.0.4",
    "flet[test]==1.0.4",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
org = "com.sorteio"
product = "Sorteio"
company = "Sorteio"
copyright = "Copyright (C) 2026"

[tool.flet.app]
path = "src"
